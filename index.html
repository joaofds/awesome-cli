<!doctype html>
<html lang="en">
  <head>
    <title>Awesome CLI</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

  </head>
  <body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 px-0">
                <div class="sidebar"><ul class="tree"></ul></div>
            </div>
            <div class="col px-0">
                <div class="content p-2"></div>
                <!-- Botão flutuante para abrir modal de novo comando -->
                <button type="button" class="btn btn-success fab" data-toggle="modal" data-target="#addCommandModal" title="Adicionar Comando">
                  +
                </button>
                <!-- Modal de cadastro de novo comando -->
                <div class="modal fade" id="addCommandModal" tabindex="-1" role="dialog" aria-labelledby="addCommandModalLabel" aria-hidden="true">
                  <div class="modal-dialog" role="document">
                    <div class="modal-content">
                      <div class="modal-header">
                        <h5 class="modal-title" id="addCommandModalLabel">Adicionar Novo Comando</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                          <span aria-hidden="true">&times;</span>
                        </button>
                      </div>
                      <div class="modal-body">
                        <form id="add-command-form">
                          <div class="form-row">
                            <div class="form-group col-md-6">
                              <label for="categoria">Categoria</label>
                              <input list="categorias-list" class="form-control" id="categoria" placeholder="Digite ou selecione" required>
                              <datalist id="categorias-list"></datalist>
                            </div>
                            <div class="form-group col-md-6">
                              <label for="subcategoria">Subcategoria</label>
                              <input list="subcategorias-list" class="form-control" id="subcategoria" placeholder="Digite ou selecione" required>
                              <datalist id="subcategorias-list"></datalist>
                            </div>
                          </div>
                          <div class="form-group">
                            <label for="nome-comando">Nome do Comando</label>
                            <input type="text" class="form-control" id="nome-comando" required>
                          </div>
                          <div class="form-group">
                            <label for="descricao">Descrição</label>
                            <input type="text" class="form-control" id="descricao" required>
                          </div>
                          <div class="form-group">
                            <label for="comando">Comando</label>
                            <textarea class="form-control" id="comando" rows="2" required></textarea>
                          </div>
                          <button type="submit" class="btn btn-success">Adicionar Comando</button>
                        </form>
                      </div>
                    </div>
                  </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="assets/js/jquery-3.3.1.slim.min.js"></script>
    <script src="assets/js/popper.min.js"></script>
    <script src="assets/js/bootstrap.min.js"></script>
    <script src="assets/js/script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
  </body>
</html>
