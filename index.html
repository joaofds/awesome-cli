<!doctype html>
<html lang="en">
  <head>
    <title>Awesome CLI</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">

  </head>
  <body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 px-0">
                <div class="sidebar"><ul class="tree"></ul></div>
            </div>
            <div class="col px-0">
                <div class="content p-2"></div>
                <!-- Formulário de cadastro de novo comando -->
                <div class="card mt-4" id="add-command-card">
                  <div class="card-header">Adicionar Novo Comando</div>
                  <div class="card-body">
                    <form id="add-command-form">
                      <div class="form-row">
                        <div class="form-group col-md-4">
                          <label for="categoria">Categoria</label>
                          <input list="categorias-list" class="form-control" id="categoria" placeholder="Digite ou selecione" required>
                          <datalist id="categorias-list"></datalist>
                        </div>
                        <div class="form-group col-md-4">
                          <label for="subcategoria">Subcategoria</label>
                          <input list="subcategorias-list" class="form-control" id="subcategoria" placeholder="Digite ou selecione" required>
                          <datalist id="subcategorias-list"></datalist>
                        </div>
                        <div class="form-group col-md-4">
                          <label for="nome-comando">Nome do Comando</label>
                          <input type="text" class="form-control" id="nome-comando" required>
                        </div>
                      </div>
                      <div class="form-group">
                        <label for="descricao">Descrição</label>
                        <input type="text" class="form-control" id="descricao" required>
                      </div>
                      <div class="form-group">
                        <label for="comando">Comando</label>
                        <textarea class="form-control" id="comando" rows="2" required></textarea>
                      </div>
                      <button type="submit" class="btn btn-success">Adicionar Comando</button>
                    </form>
                  </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="assets/js/jquery-3.3.1.slim.min.js"></script>
    <script src="assets/js/popper.min.js"></script>
    <script src="assets/js/bootstrap.min.js"></script>
    <script src="assets/js/script.js"></script>
  </body>
</html>
